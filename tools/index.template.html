<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程讲义</title>
<meta name="description" content="课程讲义：各门课程的题型讲义、课程笔记与学习心得。">
<meta property="og:title" content="课程讲义 · Course Notes">
<meta property="og:description" content="各门课程的讲义与笔记，持续更新。">
<link rel="icon" href="${FAVICON}">
<link rel="stylesheet" href="assets/rail.css?v=${VRCSS}">
<script defer src="assets/search-index.js?v=${VIDX}"></script>
<script defer src="assets/rail.js?v=${VRJS}"></script>
<style>
  /* FONTS:BEGIN */
  /* FONTS:END */
  :root{
    --bg:#13110f;
    --paper:#efe6d2;
    --ink:#ece4d4;
    --ink-2:rgb(236 228 212 / .62);
    --ink-3:rgb(236 228 212 / .42);
    --rule:rgb(236 228 212 / .14);
    --ease:cubic-bezier(.2,.8,.2,1);
    --serif:"Portal Serif SC","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:"Portal Sans","Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    --italic:"Portal Italic","Palatino Linotype","Book Antiqua",Palatino,serif;
    --k:1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg);color-scheme:dark}
  body{
    min-height:100vh;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
    /* 一盏台灯从上方照下来 */
    background:
      radial-gradient(1100px 620px at 38% -120px, rgb(255 226 180 / .075), transparent 70%),
      var(--bg);
  }
  .wrap{max-width:1160px;margin:0 auto;padding:clamp(28px,6vh,64px) 32px 0}

  /* ============ 书架 ============ */
  .shelf{position:relative;display:flex;align-items:flex-end;gap:calc(7px * var(--k));padding:0 calc(18px * var(--k))}
  /* 层板：上表面一条亮边 + 一块有厚度的前沿 */
  .plank{
    position:relative;height:34px;border-radius:2px 2px 3px 3px;
    background:
      linear-gradient(180deg,#4a4138 0,#3a322b 3px,#2b251f 4px,#241f1a 60%,#1c1814 100%);
    box-shadow:inset 0 -1px 0 rgb(0 0 0 / .5), 0 30px 44px -16px rgb(0 0 0 / .9);
  }
  .plank::after{ /* 书在木板上的投影 */
    content:"";position:absolute;left:2%;right:2%;top:-6px;height:6px;
    background:linear-gradient(0deg,rgb(0 0 0 / .45),transparent);pointer-events:none;
  }
  /* 层签：铜框里插着一张手写体般的小卡片，像图书馆书架的分类签 */
  .tag{
    position:absolute;left:calc(18px * var(--k) + 6px);top:9px;
    display:flex;align-items:baseline;gap:10px;padding:3px 12px 4px;
    font-family:var(--serif);font-weight:500;font-size:13px;line-height:1.3;letter-spacing:.04em;white-space:nowrap;
    color:#3a2f22;
    background:linear-gradient(180deg,#e9dfc8,#ddd0b2);
    border-radius:1px;
    box-shadow:
      0 0 0 1px #8a7048,               /* 铜框内沿 */
      0 0 0 3px #5b4a33,               /* 铜框 */
      0 0 0 3.5px rgb(255 230 180 / .18),
      0 2px 4px 3px rgb(0 0 0 / .45);
  }
  .tag .sno{color:#2b2218}
  .tag .sname{font-weight:400;color:#6a5a44}
  .tag::before,.tag::after{ /* 铜框两端的铆钉 */
    content:"";position:absolute;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;
    background:#b39566;box-shadow:0 0 0 .5px #3d3122;
  }
  .tag::before{left:-6px}
  .tag::after{right:-6px}

  /* ============ 书脊 ============ */
  .book{
    --c:90 74 140;
    position:relative;flex:none;display:flex;flex-direction:column;align-items:center;
    width:calc(var(--w) * var(--k));height:calc(var(--h) * var(--k));
    padding:calc(30px * var(--k)) 0 calc(26px * var(--k));
    border-radius:3px 3px 1px 1px;color:var(--paper);text-decoration:none;outline:none;
    /* 布面书脊：两侧压暗，左侧一道柔光，表现弧度 */
    background:
      linear-gradient(90deg,
        rgb(0 0 0 / .34) 0%, rgb(0 0 0 / .06) 9%, rgb(255 255 255 / .07) 24%,
        rgb(255 255 255 / 0) 42%, rgb(0 0 0 / .05) 78%, rgb(0 0 0 / .38) 100%),
      rgb(var(--c));
    box-shadow:0 0 0 1px rgb(0 0 0 / .35), 0 -1px 0 rgb(255 255 255 / .1) inset;
    transition:transform .6s var(--ease), filter .6s var(--ease), box-shadow .6s var(--ease);
    animation:shelve .9s var(--ease) both;animation-delay:calc(var(--d) * 70ms + 120ms);
  }
  @keyframes shelve{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}

  /* 烫金横线（上下各两道） */
  .book::before,.book::after{
    content:"";position:absolute;left:12%;right:12%;height:5px;pointer-events:none;
    border-top:1px solid rgb(var(--gold) / .7);border-bottom:1px solid rgb(var(--gold) / .7);
  }
  .book::before{top:calc(16px * var(--k))}
  .book::after{bottom:calc(14px * var(--k))}
  .book{--gold:226 200 150}

  .vol{font-family:var(--serif);font-size:calc(13px * var(--k));letter-spacing:.2em;padding-left:.2em;color:rgb(var(--gold) / .95)}
  .spine{
    flex:1;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;flex-direction:column;gap:calc(10px * var(--k));margin:calc(22px * var(--k)) 0;
  }
  .spine h2{font-family:var(--serif);font-weight:500;font-size:calc(25px * var(--k));letter-spacing:.16em;line-height:1;color:var(--paper);white-space:nowrap}
  .spine .en{font-size:max(8.5px, calc(10.5px * var(--k)));letter-spacing:.06em;line-height:1;color:rgb(239 230 210 / .62);white-space:nowrap}
  .glyph{width:calc(34px * var(--k));height:calc(34px * var(--k));flex:none;color:rgb(var(--gold) / .9);
    fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
  .glyph .dot{fill:currentColor;stroke:none}
  .glyph .faint{opacity:.45}

  /* 抽出一本：上移、提亮；其余的书稍暗 */
  .book:hover,.book:focus-visible{transform:translateY(-22px);filter:brightness(1.12) saturate(1.05);
    box-shadow:0 0 0 1px rgb(0 0 0 / .35), 0 -1px 0 rgb(255 255 255 / .14) inset, 0 30px 30px -18px rgb(0 0 0 / .7)}
  .book:focus-visible{outline:1.5px solid rgb(var(--gold) / .9);outline-offset:4px}
  .wrap:has(.book:hover) .book:not(:hover),
  .wrap:has(.book:focus-visible) .book:not(:focus-visible){filter:brightness(.72) saturate(.85)}


  /* ============ 辑 ============ */
  .series + .series{margin-top:clamp(56px,9vh,96px)}

  /* 浅色书脊（如「光」）：深色字 */
  .book.light{color:#2b2419;--gold:112 84 36}
  .book.light .spine h2{color:#2b2419}
  .book.light .spine .en{color:rgb(43 36 25 / .72)}

  /* 仅供读屏的文字 */
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ============ 一封信 ============ */
  .letter{
    flex:none;align-self:flex-end;margin:0 calc(10px * var(--k)) 0 auto;padding:0 0 calc(4px * var(--k));
    display:flex;flex-direction:column-reverse;align-items:center;gap:calc(18px * var(--k));
    background:none;border:0;color:inherit;font:inherit;cursor:pointer;
    animation:shelve .9s var(--ease) both;animation-delay:calc(var(--d) * 70ms + 120ms);
  }
  .env-label{font-family:var(--serif);font-size:13px;letter-spacing:.06em;color:var(--ink-3);transition:color .5s var(--ease),opacity .4s var(--ease)}
  .letter:hover .env-label,.letter:focus-visible .env-label{color:var(--paper)}
  .env{
    position:relative;display:block;width:calc(168px * var(--k));height:calc(114px * var(--k));perspective:700px;
    transform:rotate(-3deg);transition:transform .7s var(--ease);filter:drop-shadow(0 16px 14px rgb(0 0 0 / .55));
  }
  .letter:hover .env,.letter:focus-visible .env,.letter.open .env{transform:rotate(-1deg) translateY(-7px)}
  .env > span{position:absolute;display:block}
  .env-back{inset:0;background:#cfc2a2;border-radius:3px}
  .env-paper{left:8%;right:8%;top:6%;bottom:14%;z-index:1;background:#f4ecd8;border-radius:2px;transition:transform .8s var(--ease)}
  .env-paper::before{content:"";position:absolute;left:14%;right:14%;top:24%;height:1px;background:rgb(80 60 30 / .22);box-shadow:0 9px 0 rgb(80 60 30 / .22),0 18px 0 rgb(80 60 30 / .22)}
  .letter:hover .env-paper,.letter:focus-visible .env-paper{transform:translateY(-14%)}
  .letter.open .env-paper{transform:translateY(-46%)}
  .env-front{inset:0;z-index:2;background:linear-gradient(135deg,#e6dbbf,#d8cba8);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:3px}
  .env-flap{left:0;right:0;top:0;height:58%;z-index:3;background:linear-gradient(180deg,#dccfae,#cdbf9c);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .6s var(--ease),z-index 0s .28s}
  .letter:hover .env-flap,.letter:focus-visible .env-flap,.letter.open .env-flap{transform:rotateX(180deg);z-index:0}
  .env-seal{left:calc(50% - 9px);top:46%;width:18px;height:18px;z-index:4;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4604a,#8a3326);box-shadow:0 2px 4px rgb(0 0 0 / .4);transition:opacity .3s}
  .letter:hover .env-seal,.letter:focus-visible .env-seal,.letter.open .env-seal{opacity:0}

  .letter-dialog{border:0;padding:0;background:transparent;color:#2b2419;width:min(580px,92vw);max-height:92vh;overflow:auto;margin:auto}
  .letter-dialog::backdrop{background:rgb(10 8 6 / .74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .letter-dialog[open]{animation:unfold .8s var(--ease) both}
  @keyframes unfold{from{opacity:0;transform:translateY(46px) scale(.96)}to{opacity:1;transform:none}}
  .paper{
    --px:clamp(26px,6vw,58px);--py:clamp(30px,6vw,54px);
    position:relative;padding:var(--py) var(--px) 30px;border-radius:3px;
    background:linear-gradient(180deg,#f4ebd5,#eadfc4);
    box-shadow:0 40px 80px -20px rgb(0 0 0 / .8),inset 0 0 70px rgb(150 120 60 / .14);
  }
  .paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:1px;background:rgb(80 60 30 / .12)}
  .paper::before{top:33%}
  .paper::after{top:66%}
  .paper h2{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.14em;margin-bottom:24px;color:#2b2419}
  .paper p{font-family:var(--serif);font-size:16.5px;line-height:2.05;letter-spacing:.04em;margin:0 0 .85em}
  .paper .sign{text-align:right;margin-top:1.8em;color:rgb(43 36 25 / .72)}
  .paper form{display:flex;justify-content:center;margin-top:18px}
  .paper .close{font-family:var(--serif);font-size:14px;letter-spacing:.3em;padding:6px 6px 6px 12px;color:rgb(43 36 25 / .7);background:none;border:0;border-bottom:1px solid rgb(43 36 25 / .3);cursor:pointer}
  .paper .close:hover{color:#2b2419;border-bottom-color:#2b2419}
  .paper .x{position:sticky;top:calc(var(--py) - 2px);height:0;margin:0;display:flex;justify-content:flex-end;z-index:3}
  .paper .x .xbtn{width:38px;height:38px;margin:calc(14px - var(--py)) calc(14px - var(--px)) 0 0;border-radius:50%;border:1px solid rgb(43 36 25 / .28);background:rgb(244 235 213 / .94);color:#2b2419;font-size:22px;line-height:1;cursor:pointer}
  .paper .x .xbtn:hover{background:#fff7e3;border-color:rgb(43 36 25 / .55)}

  /* ============ 待续：书架上的空位 ============ */
  .slot{
    flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    width:calc(104px * var(--k));height:calc(392px * var(--k));padding:calc(28px * var(--k)) 0;
    border:1px dashed rgb(236 228 212 / .2);border-bottom:none;border-radius:3px 3px 0 0;
    animation:shelve .9s var(--ease) both;animation-delay:calc(var(--d) * 70ms + 120ms);
  }
  .slot .spine{margin:0;gap:calc(12px * var(--k))}
  .slot h2{font-size:calc(17px * var(--k));font-weight:400;color:var(--ink-2)}
  .slot .en{color:var(--ink-3)}
  .slot .vol{color:var(--ink-3);letter-spacing:.08em;font-family:var(--sans);font-size:calc(11px * var(--k))}

  /* ============ 响应式 ============ */
  @media (max-width:1100px){:root{--k:.82}}
  @media (max-width:880px){:root{--k:.62}}

  /* 手机：书从书架上放倒，叠成一摞 */
  @media (max-width:720px){
    .wrap{padding:28px 20px 0}
    .shelf{flex-direction:column;align-items:stretch;gap:6px;padding:0}
    .series{display:flex;flex-direction:column}
    .plank{order:-1;height:auto;margin-bottom:14px;background:none;box-shadow:none}
    .plank::after{display:none}
    .tag{position:relative;left:auto;top:auto;display:inline-flex;margin:3px 3px 3px 9px}
    .book{
      width:auto;height:auto;flex-direction:row;padding:20px 22px 20px 26px;gap:16px;border-radius:2px;
      background:
        linear-gradient(180deg, rgb(255 255 255 / .07) 0%, rgb(255 255 255 / 0) 30%, rgb(0 0 0 / .08) 75%, rgb(0 0 0 / .3) 100%),
        rgb(var(--c));
    }
    .book::before,.book::after{top:14%;bottom:14%;left:auto;right:auto;width:5px;height:auto;
      border:none;border-left:1px solid rgb(var(--gold) / .7);border-right:1px solid rgb(var(--gold) / .7)}
    .book::before{left:9px}
    .book::after{right:9px}
    .vol{flex:none;font-size:12px;width:3.2em}
    .spine{writing-mode:horizontal-tb;flex-direction:column;flex:1;align-items:flex-start;gap:6px;margin:0}
    .spine h2{font-size:19px;letter-spacing:.08em;line-height:1.3;white-space:normal}
    .spine .en{font-size:11px;white-space:normal;line-height:1.4}
    .glyph{width:30px;height:30px;margin-left:auto;margin-right:6px}
    .book:hover,.book:focus-visible{transform:translateX(6px)}
    .slot{width:auto;height:auto;flex-direction:row;justify-content:flex-start;gap:16px;padding:16px 26px;border-bottom:1px dashed rgb(236 228 212 / .2);border-radius:2px}
    .slot .vol{width:4.6em;flex:none;white-space:nowrap}
  }
  @media (max-width:720px){
    .series + .series{margin-top:44px}
  }
  @media (min-width:1241px){
    .letter:hover .env-label,.letter:focus-visible .env-label,.letter.open .env-label{opacity:0}
  }
  @media (max-width:1240px){
    .letter{order:-1;flex-direction:row;justify-content:flex-start;align-self:stretch;width:100%;margin:0;padding:6px 6px 14px;gap:18px;border:0;text-align:left}
    .env{width:70px;height:48px}
    .env-label{font-size:15px;letter-spacing:.16em;color:var(--ink-2)}
  }
  @media (min-width:721px) and (max-width:1240px){
    .shelf{flex-wrap:wrap;row-gap:calc(30px * var(--k))}
  }
  @media (prefers-reduced-motion:reduce){
    .book,.slot,.letter,.env,.env-paper,.env-flap{animation:none;transition:none}
    .letter-dialog[open]{animation:none}
  }
</style>
</head>
<body class="home" data-root="./">
${RAIL}
<div class="wrap">
  <h1 class="sr">课程讲义</h1>

  <main>
${SERIES}
  </main>
</div>
${FOOTER}
${LETTER_DIALOG}
<script>
(() => {
  const btn = document.querySelector('.letter');
  const dlg = document.querySelector('.letter-dialog');
  if (!btn || !dlg || typeof dlg.showModal !== 'function') return;
  btn.addEventListener('click', () => {
    btn.classList.add('open');
    setTimeout(() => { if (!dlg.open) { dlg.showModal(); dlg.scrollTop = 0; } }, 520);
  });
  dlg.addEventListener('close', () => btn.classList.remove('open'));
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
})();
</script>
</body>
</html>
